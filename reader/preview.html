<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>HBS-KIT Preview — Multidimensional Book (scroll-driven demo)</title>
  <style>
    :root{--side-width:25vw}
    body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; margin: 0; height: 100vh; display: flex; }
    #main { width: calc(100% - var(--side-width)); padding: 32px; overflow: auto; border-right: 1px solid #e6e6e6; }
    #side { width: var(--side-width); padding: 16px; overflow: auto; background: #fafafa; position: relative; }
    .panel-container { position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow:auto; }
    .panel { background: white; border-radius: 8px; box-shadow: 0 6px 18px rgba(20,20,30,0.06); padding: 14px; margin-bottom: 12px; transform: translateX(18px); opacity: 0; transition: transform 320ms ease, opacity 320ms ease; }
    .panel.show { transform: translateX(0); opacity: 1; }
    .panel h3 { margin:0 0 8px 0; font-size:15px }
    .panel .source { font-size:12px; color:#666; margin-bottom:8px }
    .tag-marker { display:block; height:1px; width:1px; overflow:hidden; position:relative; }
    header { display:flex; align-items:baseline; gap:12px; }
    header h1 { margin:0; font-size:18px }
    .meta { color: #666; font-size:13px }
    .hint { color:#444; margin-top:8px }
    .para { margin: 28px 0; line-height:1.6 }
    /* Small visual helper for debugging markers (hidden by default) */
    .marker-dot { width:8px; height:8px; background:#0366d6; border-radius:50%; display:inline-block; margin-left:8px; vertical-align:middle; }
    @media (max-width:800px) { #main { padding:18px } #side { display:none } }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
<div id="main">
  <header>
    <h1>HBS-KIT Preview — Scroll-driven demo</h1>
    <div class="meta">Long main text with dynamic sub-book panels appearing as you scroll.</div>
  </header>
  <div class="hint">Scroll the main text. When you reach a tagged passage, the linked sub-book panel will slide in on the right (stacked panels supported).</div>
  <hr />
  <div id="main-content"></div>
</div>
<div id="side">
  <div class="panel-container" id="panel-container">
    <h2 id="side-title">Loaded Context</h2>
    <div id="side-panels"></div>
  </div>
</div>

<!-- Small embedded fallback manifest & tags in case fetch fails -->
<script id="manifest" type="application/json">
  {
    "title": "Sample Multidimensional Book (Demo)",
    "description": "Scroll-driven demo for the Multidimensional Book project.",
    "books": [
      { "id": "main", "path": "../examples/main_book/main.md", "title": "Main Book" },
      { "id": "sub1", "path": "../examples/subbooks/sub1.md", "title": "Sub-book 1: Theory" },
      { "id": "sub2", "path": "../examples/subbooks/sub2.md", "title": "Sub-book 2: Deep Dive" },
      { "id": "sub3", "path": "../examples/subbooks/sub3.md", "title": "Sub-book 3: Example Applications" }
    ],
    "tags_path": "../examples/metadata/tags.json",
    "format_version": "0.1"
  }
</script>

<script id="tags" type="application/json">
  [
    { "id": "tag_001", "main_book": { "book_id": "main", "section": "para3" }, "subbook": { "book_id": "sub1", "section": "para1" }, "description": "Background theory for concept A", "active": true },
    { "id": "tag_002", "main_book": { "book_id": "main", "section": "para6" }, "subbook": { "book_id": "sub2", "section": "para1" }, "description": "Detailed proof sketch for claim B", "active": true },
    { "id": "tag_003", "main_book": { "book_id": "main", "section": "para9" }, "subbook": { "book_id": "sub3", "section": "para1" }, "description": "Applied examples for technique C", "active": true }
  ]
</script>

<script>
  (async function(){
    // Helper to fetch text, return null on failure
    async function tryFetchText(url){
      try {
        const res = await fetch(url);
        if (res.ok) return await res.text();
      } catch(e){}
      return null;
    }

    // 1) Load manifest: prefer examples/manifest.json, fallback to embedded #manifest
    let manifestText = await tryFetchText('../examples/manifest.json');
    if (!manifestText && document.getElementById('manifest')) {
      manifestText = document.getElementById('manifest').textContent;
    }
    const manifest = manifestText ? JSON.parse(manifestText) : JSON.parse(document.getElementById('manifest').textContent);

    // 2) Load tags JSON (try manifest.tags_path then embedded)
    let tagsText = null;
    if (manifest && manifest.tags_path) tagsText = await tryFetchText(manifest.tags_path);
    if (!tagsText && document.getElementById('tags')) tagsText = document.getElementById('tags').textContent;
    const tags = tagsText ? JSON.parse(tagsText) : (document.getElementById('tags') ? JSON.parse(document.getElementById('tags').textContent) : []);

    // 3) Load main markdown: prefer main_long.md, then main.md, fallback to small embedded sample
    let mainMd = await tryFetchText('../examples/main_book/main_long.md')
            || await tryFetchText('../examples/main_book/main.md');
    if (!mainMd) {
      // Fallback to small embedded sample to avoid blank page
      mainMd = '# Sample Main Book — Long Demo\\n\\nThis demo content is not available via fetch; please ensure the examples/ files are present in the repository.';
    }

    // 4) Load subbook contents by manifest paths (fallback to simple message)
    const subContents = {};
    for (const b of manifest.books || []) {
      if (!b || !b.id) continue;
      let txt = null;
      if (b.path) txt = await tryFetchText(b.path);
      if (!txt) txt = `# ${b.title || 'Sub-book'}\\n\\n(Sub-book content not available.)`;
      subContents[b.id] = txt;
    }

    // --- Render and interaction logic (adapted from original) ---

    function buildMainHtml(md) {
      const parts = md.split(/\\n\\n+/);
      const htmlParts = parts.map((p, idx) => {
        const paraIndex = idx + 1; // 1-based
        const replaced = p.replace(/\\[tag:(.+?)\\]/g, (m, id) => {
          return `<span class="tag-marker" data-tag="${id}" data-para="para${paraIndex}" aria-hidden="true"></span>`;
        });
        const rendered = marked.parseInline(replaced);
        return `<div class="para" data-para="para${paraIndex}">${rendered}</div>`;
      });
      return htmlParts.join('\\n');
    }

    // Insert markers if not present (keeps previous behavior)
    let demoMd = mainMd;
    demoMd = demoMd.replace(/(Paragraph 3[\\s\\S]*?\\.)/,'$1 [tag:tag_001]');
    demoMd = demoMd.replace(/(Paragraph 6[\\s\\S]*?\\.)/,'$1 [tag:tag_002]');
    demoMd = demoMd.replace(/(Paragraph 9[\\s\\S]*?\\.)/,'$1 [tag:tag_003]');

    document.getElementById('main-content').innerHTML = buildMainHtml(demoMd);

    const activePanels = new Map();
    const sidePanels = document.getElementById('side-panels');

    function createPanelForTag(tagObj) {
      const id = tagObj.id;
      if (activePanels.has(id)) return;
      const panel = document.createElement('div');
      panel.className = 'panel';
      panel.setAttribute('data-tag', id);
      const title = (manifest.books || []).find(b => b.id === tagObj.subbook.book_id)?.title || 'Sub-book';
      panel.innerHTML = `<h3>${title}</h3><div class="source">${tagObj.description}</div><div class="content">Loading...</div>`;
      sidePanels.insertBefore(panel, sidePanels.firstChild);
      requestAnimationFrame(()=> panel.classList.add('show'));
      activePanels.set(id, panel);

      const contentMd = subContents[tagObj.subbook.book_id] || '*Sub-book content not available.*';
      panel.querySelector('.content').innerHTML = marked.parse(contentMd);
    }

    function removePanelForTag(id) {
      const panel = activePanels.get(id);
      if (!panel) return;
      panel.classList.remove('show');
      panel.addEventListener('transitionend', ()=> panel.remove(), { once: true });
      activePanels.delete(id);
    }

    const markers = () => Array.from(document.querySelectorAll('.tag-marker'));

    function checkMarkers() {
      const topThreshold = window.innerHeight * 0.25;
      const toActivate = new Set();
      markers().forEach(m => {
        const rect = m.getBoundingClientRect();
        const id = m.dataset.tag;
        if (rect.top <= topThreshold && rect.bottom >= 0) toActivate.add(id);
      });
      toActivate.forEach(id => {
        const tagObj = tags.find(t => t.id === id);
        if (tagObj) createPanelForTag(tagObj);
      });
      Array.from(activePanels.keys()).forEach(id => {
        if (!toActivate.has(id)) removePanelForTag(id);
      });
    }

    let ticking = false;
    document.getElementById('main').addEventListener('scroll', ()=>{
      if (!ticking) {
        window.requestAnimationFrame(()=>{ checkMarkers(); ticking = false; });
        ticking = true;
      }
    });
    window.addEventListener('resize', checkMarkers);
    checkMarkers();

    // Accessibility keyboard hooks
    document.querySelectorAll('.para').forEach(p => {
      p.setAttribute('tabindex','0');
      p.addEventListener('focus', ()=> checkMarkers());
    });

  })();
</script>
</body>
</html>
