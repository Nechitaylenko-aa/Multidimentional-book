name: Create HBS-KIT release

on:
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Debug - show repo layout
        run: |
          echo "=== pwd ==="
          pwd
          echo "=== git status ==="
          git status --porcelain -b || true
          echo "=== git rev-parse HEAD ==="
          git rev-parse HEAD || true
          echo "=== listing root ==="
          ls -la
          echo "=== listing examples ==="
          ls -la examples || true
          echo "=== try show examples/manifest.json ==="
          if [ -f examples/manifest.json ]; then
            echo '--- examples/manifest.json:'
            cat examples/manifest.json
          else
            echo 'NO examples/manifest.json found'
          fi
          echo "=== try show examples/hbs-kit-sample/manifest.json ==="
          if [ -f examples/hbs-kit-sample/manifest.json ]; then
            echo '--- examples/hbs-kit-sample/manifest.json:'
            cat examples/hbs-kit-sample/manifest.json
          else
            echo 'NO examples/hbs-kit-sample/manifest.json found'
          fi

      - name: Create HBS-KIT zip (manifest at root, from examples/)
        run: |
          set -xe
          mkdir -p release_temp
          if [ -f examples/manifest.json ]; then
            cp examples/manifest.json release_temp/manifest.json
          elif [ -f examples/hbs-kit-sample/manifest.json ]; then
            cp examples/hbs-kit-sample/manifest.json release_temp/manifest.json
          else
            echo "ERROR: no manifest found in examples/ or examples/hbs-kit-sample/"
            exit 2
          fi
          mkdir -p release_temp/main_book release_temp/subbooks release_temp/metadata
          cp -r examples/main_book/* release_temp/main_book/ || true
          cp -r examples/subbooks/* release_temp/subbooks/ || true
          cp -r examples/metadata/* release_temp/metadata/ || true
          cd release_temp && zip -r ../hbs-kit-sample.zip .

      - name: Create GitHub Release v0.1
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: v0.1
          release_name: HBS-KIT sample v0.1
          body: Sample HBS-KIT for Multidimensional Book demo
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload ZIP to release
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./hbs-kit-sample.zip
          asset_name: hbs-kit-sample.zip
          asset_content_type: application/zip
